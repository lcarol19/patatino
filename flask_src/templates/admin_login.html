{% extends "base.html" %}

{% block title %}Acesso restrito{% endblock %}

{% block content %}
<section class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5 text-center">

                    <img
                        src="{{ url_for('static', filename='img/logo_cafofe.webp') }}"
                        alt="Logo Cafofe"
                        style="max-width: 100px;"
                        class="mb-3"
                    >

                    <h2 class="fw-bold mb-2">Acesso restrito</h2>

                    <p class="text-muted mb-4">
                        Área exclusiva para administração da ONG Cafofe.
                    </p>

                    <form method="POST">
                        <div class="mb-3 text-start">
                            <label for="senha" class="form-label">
                                Senha de acesso
                            </label>

                            <input
                                type="password"
                                class="form-control form-control-lg"
                                id="senha"
                                name="senha"
                                placeholder="Digite a senha"
                                required
                                autofocus
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >
                            <i class="fa-solid fa-lock me-2"></i>
                            Entrar
                        </button>
                    </form>

                    <a
                        href="{{ url_for('animal.home') }}"
                        class="btn btn-link mt-3 text-decoration-none"
                    >
                        Voltar ao início
                    </a>

                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
